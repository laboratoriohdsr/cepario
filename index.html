        <div class="f"><label>Nombre completo <span class="req">*</span></label><input id="fu_nombre" value="${esc(u.nombre || "")}" placeholder="Ana Muriel"></div>
        <div class="f"><label>Usuario (para entrar) <span class="req">*</span></label><input id="fu_usuario" value="${esc(u.usuario || "")}" placeholder="ana.muriel"></div>
        <div class="f"><label>Contraseña <span class="req">*</span></label><input id="fu_pass" value="${esc(u.password || "")}" placeholder="mínimo 4 caracteres"></div>
        <div class="f"><label>Rol</label>
          <select id="fu_rol" onchange="app.rolCambio()">
            ${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${u.rol === k ? "selected" : ""}>${v.nom}</option>`).join("")}
          </select><span class="hint">El rol fija los permisos base; abajo puedes ajustarlos uno por uno.</span></div>
        <div class="f"><label>Estado</label><select id="fu_activo"><option value="1" ${u.activo !== false ? "selected" : ""}>Activo</option><option value="0" ${u.activo === false ? "selected" : ""}>Inactivo</option></select></div>
      </div>
      <fieldset class="fset" style="margin-top:14px"><legend>Permisos</legend>
        <div id="fu_perms">${permHTML}</div>
      </fieldset>
    </div>
    <div class="mfoot2">
      ${ed && state.usuarios.length > 1 ? `<button class="btn danger" onclick="app.borrarUsuario('${ed.id}')">Eliminar</button>` : ""}
      <button class="btn" onclick="app.cerrar()">Cancelar</button>
      <button class="btn primary" onclick="app.saveUsuario()">${ed ? "Guardar" : "Crear usuario"}</button>
    </div>`);
}

function rolCambio() {
  const rol = document.getElementById("fu_rol").value;
  const base = ROLES[rol]?.perms || [];
  document.querySelectorAll(".fu_perm").forEach(chk => { chk.checked = base.includes(chk.dataset.k); });
}

async function saveUsuario() {
  const id = val("fu_id");
  const nombre = val("fu_nombre"), usuario = val("fu_usuario"), pass = val("fu_pass");
  const rol = val("fu_rol");
  if (!nombre) return toast("Falta el nombre.", "err");
  if (!usuario) return toast("Falta el usuario para entrar.", "err");
  if (!pass || pass.length < 4) return toast("La contraseña debe tener al menos 4 caracteres.", "err");
  if (state.usuarios.some(u => u.id !== id && (u.usuario || "").toLowerCase() === usuario.toLowerCase()))
    return toast("Ya existe un usuario con ese nombre de acceso.", "err");

  const prev = id ? state.usuarios.find(u => u.id === id) : null;
  const permisos = {};
  document.querySelectorAll(".fu_perm").forEach(chk => {
    const base = (ROLES[rol]?.perms || []).includes(chk.dataset.k);
    if (chk.checked !== base) permisos[chk.dataset.k] = chk.checked;  // sólo guardar diferencias
  });

  const u = {
    id: id || uid(), nombre, usuario, password: pass, rol,
    activo: val("fu_activo") === "1", permisos,
    creado: prev?.creado || new Date().toISOString()
  };
  await guardar("usuarios", u);
  if (state.usuario && state.usuario.id === u.id) state.usuario = u;  // refrescar sesión propia
  cerrarModal();
  aplicarUsuarioUI();
  toast(id ? "Usuario actualizado" : "Usuario creado", "ok");
}

async function borrarUsuario(id) {
  if (state.usuarios.length <= 1) return toast("Debe quedar al menos un usuario.", "err");
  const u = state.usuarios.find(x => x.id === id);
  if (u.rol === "admin" && state.usuarios.filter(x => x.rol === "admin" && x.activo !== false).length <= 1)
    return toast("No puedes eliminar al único administrador.", "err");
  if (!confirm(`¿Eliminar al usuario ${u.nombre}?`)) return;
  await borrar("usuarios", id);
  if (state.usuario && state.usuario.id === id) cerrarSesion();
  else { cerrarModal(); toast("Usuario eliminado", "ok"); }
}

/* Perfil: cambiar la propia contraseña */
function formPerfil() {
  const u = state.usuario;
  if (!u) return;
  abrirModal(`
    <div class="mhead"><div><h3>Mi perfil</h3><div class="msub">${esc(u.nombre)} · ${ROLES[u.rol]?.nom}</div></div>
      <button class="x" onclick="app.cerrar()">×</button></div>
    <div class="mbody">
      <div class="fgrid">
        <div class="f full"><label>Contraseña actual</label><input type="password" id="pf_actual"></div>
        <div class="f"><label>Nueva contraseña</label><input type="password" id="pf_nueva"></div>
        <div class="f"><label>Repetir nueva</label><input type="password" id="pf_rep"></div>
      </div>
    </div>
    <div class="mfoot2"><button class="btn" onclick="app.cerrar()">Cancelar</button>
      <button class="btn primary" onclick="app.cambiarPass()">Cambiar contraseña</button></div>`, "narrow");
}
async function cambiarPass() {
  const u = state.usuario;
  const act = val("pf_actual"), nue = val("pf_nueva"), rep = val("pf_rep");
  if (String(u.password || "") !== act) return toast("La contraseña actual no coincide.", "err");
  if (!nue || nue.length < 4) return toast("La nueva contraseña debe tener al menos 4 caracteres.", "err");
  if (nue !== rep) return toast("Las contraseñas nuevas no coinciden.", "err");
  const nu = { ...u, password: nue };
  await guardar("usuarios", nu);
  state.usuario = nu;
  cerrarModal(); toast("Contraseña actualizada", "ok");
}


/* ══════════════════════════════════════════════════════════════
   PAPELERA (panel en configuración)
   ══════════════════════════════════════════════════════════════ */
function panelPapelera() {
  const items = [...state.papelera].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
  return `<fieldset class="fset"><legend>Papelera (${items.length})</legend>
    <p style="font-size:12.5px;color:var(--ink-3);margin-bottom:12px">
      Aquí llega lo que se elimina. Restaura lo que se borró por error o vacíala para liberar espacio.</p>
    ${items.length ? `
    <div class="rowbtns" style="margin-bottom:12px"><button class="btn danger sm" onclick="app.vaciarPapelera()">Vaciar papelera</button></div>
    <div class="alist" style="border:1px solid var(--line);border-radius:12px;overflow:hidden">
      ${items.map(r => {
        const esCepa = r.tipo === "cepa";
        const t = esCepa
          ? `${esc(r.payload.cepa.codigo)} — <i>${esc(r.payload.cepa.microorganismo)}</i>`
          : `Mes ${esc(mesLabel(r.payload.mes.id))} · ${(r.payload.cepas || []).length} cepa(s)`;
        return `<div class="al">
          <div class="ico ${esCepa ? "b" : "a"}">${esCepa ? "🧫" : "📅"}</div>
          <div class="tx"><b>${t}</b><div class="m">Eliminado por ${esc(r.por)} · ${fFecha((r.fecha || "").slice(0, 10))}</div></div>
          <button class="btn sm primary" onclick="app.restaurarPapelera('${r.id}')">Restaurar</button>
          <button class="btn sm ghost" onclick="app.purgarPapelera('${r.id}')">Eliminar</button>
        </div>`;
      }).join("")}
    </div>` : `<div class="empty-st" style="padding:24px"><p>La papelera está vacía.</p></div>`}
  </fieldset>`;
}


window.app = {
  ir, setF, limpiarF, formCepa, saveCepa, borrarCepa, detalle, subirPase, setAB, recalcPase,
  verMes, formMes, saveMes, borrarMes, formQC, saveQC, borrarQC,
  saveCfg, resetCfg, exportCSV, exportJSON, cerrar: cerrarModal, diagnostico, copiarReglas,
  imprimir, vGradillas,
  entrar, entrarOtro, cerrarSesion, formPerfil, cambiarPass,
  formUsuario, saveUsuario, borrarUsuario, verPwd, rolCambio,
  restaurarPapelera, purgarPapelera, vaciarPapelera
};
window.checkPin = checkPin;

loadLocal();
aplicarMarca();
asegurarMesActual();
// restaurar sesión de esta pestaña (si aplica)
try {
  const uid_ = sessionStorage.getItem("cepario_uid");
  if (uid_) { const u = state.usuarios.find(x => x.id === uid_); if (u) state.usuario = u; }
} catch (e) {}
aplicarUsuarioUI();
reiniciarInactividad();
render();
escuchar();


</script>

<script>
/* ══════════ PWA: instalación e integración con el sistema ══════════ */
(function () {
  var deferred = null;
  var bar = document.getElementById("installBar");
  var txt = document.getElementById("installTxt");
  var btn = document.getElementById("installBtn");

  function esStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches
        || window.matchMedia("(display-mode: minimal-ui)").matches
        || navigator.standalone === true
        || document.referrer.startsWith("android-app://")
        || new URLSearchParams(location.search).get("src") === "pwa";
  }
  var enPie = esStandalone();
  var ua = navigator.userAgent || "";
  var esIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var esAndroid = /android/i.test(ua);

  function ocultado() { try { return localStorage.getItem("pwa_oculto") === "1"; } catch (e) { return false; } }
  function mostrar() { if (bar && !esStandalone() && !ocultado()) bar.hidden = false; }
  function ocultar() {
    if (bar) { bar.hidden = true; bar.style.display = "none"; }
    try { localStorage.setItem("pwa_oculto", "1"); } catch (e) {}
  }

  // ----- Android / Chrome / Edge: evento nativo de instalación -----
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    if (!enPie && !ocultado()) mostrar();
  });

  window.addEventListener("appinstalled", function () {
    if (bar) bar.hidden = true;
    try { localStorage.setItem("pwa_oculto", "1"); } catch (e) {}
    if (window.toast) toast("Cepario instalado", "ok");
  });

  async function instalar() {
    // Caso Android: usar el prompt nativo
    if (deferred) {
      deferred.prompt();
      try { await deferred.userChoice; } catch (e) {}
      deferred = null;
      if (bar) bar.hidden = true;
      return;
    }
    // Caso iOS (Safari no ofrece prompt): mostrar instrucciones
    if (esIOS) { instruccionesIOS(); return; }
    // Otros navegadores
    instruccionesGenericas();
  }

  function instruccionesIOS() {
    var esSafari = /safari/i.test(ua) && !/crios|fxios|edgios/i.test(ua);
    var m = document.createElement("div");
    m.className = "ovl";
    m.innerHTML =
      '<div class="modal narrow">' +
        '<div class="mhead"><div><h3>Instalar en iPhone / iPad</h3>' +
          '<div class="msub">Se agrega a la pantalla de inicio como una app</div></div>' +
          '<button class="x" onclick="this.closest(&quot;.ovl&quot;).remove()">×</button></div>' +
        '<div class="mbody"><div class="ios-steps">' +
          (esSafari ? "" :
            '<div class="step"><div class="num">!</div><div>En iPhone esto solo funciona desde <b>Safari</b>. Abre este mismo enlace en Safari y repite los pasos.</div></div>') +
          '<div class="step"><div class="num">1</div><div>Toca el botón <b>Compartir</b>' +
            '<span class="shareico">&#x2191;</span> en la barra de Safari (abajo).</div></div>' +
          '<div class="step"><div class="num">2</div><div>Desliza y elige <b>Añadir a pantalla de inicio</b>.</div></div>' +
          '<div class="step"><div class="num">3</div><div>Confirma con <b>Añadir</b>. El ícono del cepario quedará en tu pantalla de inicio.</div></div>' +
        '</div></div>' +
        '<div class="mfoot2"><button class="btn primary" onclick="this.closest(&quot;.ovl&quot;).remove()">Entendido</button></div>' +
      '</div>';
    m.addEventListener("click", function (e) { if (e.target === m) m.remove(); });
    document.getElementById("modals").appendChild(m);
  }

  function instruccionesGenericas() {
    var m = document.createElement("div");
    m.className = "ovl";
    m.innerHTML =
      '<div class="modal narrow">' +
        '<div class="mhead"><div><h3>Instalar la app</h3></div>' +
          '<button class="x" onclick="this.closest(&quot;.ovl&quot;).remove()">×</button></div>' +
        '<div class="mbody"><p style="font-size:14px">Abre el menú del navegador (&#8942; o la barra de direcciones) y elige ' +
          '<b>Instalar aplicación</b> o <b>Agregar a la pantalla de inicio</b>.</p></div>' +
        '<div class="mfoot2"><button class="btn primary" onclick="this.closest(&quot;.ovl&quot;).remove()">Entendido</button></div>' +
      '</div>';
    m.addEventListener("click", function (e) { if (e.target === m) m.remove(); });
    document.getElementById("modals").appendChild(m);
  }

  // En iOS no hay beforeinstallprompt: ofrecer el banner con instrucciones
  if (esIOS && !enPie && !ocultado()) {
    if (txt) txt.textContent = "Agrégalo a tu pantalla de inicio desde Safari para abrirlo como app.";
    if (btn) btn.textContent = "Cómo instalar";
    setTimeout(mostrar, 1200);
  }

  window.pwa = { instalar: instalar, ocultar: ocultar, iosHelp: instruccionesIOS };

  // ----- Registro del Service Worker -----
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (e) {
        console.warn("SW no registrado:", e);
      });
    });
  }

  // ----- Atajos del manifest / enlaces con ?ir= -----
  window.addEventListener("load", function () {
    try {
      var p = new URLSearchParams(location.search);
      var ir = p.get("ir");
      if (ir && window.app) {
        if (ir === "nativa" || ir === "atcc") { app.ir("cepario"); setTimeout(function(){ app.formCepa(ir); }, 300); }
        else app.ir(ir);
      }
    } catch (e) {}
  });
})();
</script>
