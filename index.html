<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#4C2A85;
  --brand-deep:#2A1354;
  --brand-soft:#7B4FC4;
  --brand-wash:#F3EFFA;
  --accent:#00B8A9;
  --ink:#1B1035;
  --ink-2:#4A4160;
  --ink-3:#7C7492;
  --line:#E4E0EE;
  --line-2:#F0EDF7;
  --bg:#F7F5FB;
  --card:#FFFFFF;
  --verde:#16A34A;
  --amarillo:#F59E0B;
  --rojo:#DC2626;
  --gris:#94A3B8;
  --r-s:8px; --r-m:14px; --r-l:22px;
  --sh-1:0 1px 2px rgba(27,16,53,.06), 0 1px 3px rgba(27,16,53,.05);
  --sh-2:0 4px 14px rgba(27,16,53,.08), 0 1px 3px rgba(27,16,53,.05);
  --sh-3:0 18px 50px rgba(27,16,53,.20);
  --display:'Bricolage Grotesque', system-ui, sans-serif;
  --body:'Inter', system-ui, -apple-system, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--body); background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--brand);text-decoration:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- BANNER ---------- */
.banner{
  background:
    radial-gradient(circle at 12% 120%, rgba(0,184,169,.30), transparent 45%),
    radial-gradient(circle at 88% -30%, rgba(123,79,196,.55), transparent 55%),
    linear-gradient(115deg, var(--brand-deep) 0%, #43217A 55%, #5B2E9D 100%);
  color:#fff; position:relative; overflow:hidden;
  padding:26px 20px 22px;
  padding-top:calc(26px + env(safe-area-inset-top));
  padding-left:calc(20px + env(safe-area-inset-left));
  padding-right:calc(20px + env(safe-area-inset-right));
}
.banner::after{ /* placa de agar: colonias */
  content:''; position:absolute; inset:0; pointer-events:none; opacity:.16;
  background-image:
    radial-gradient(circle, #fff 1.6px, transparent 1.9px),
    radial-gradient(circle, #fff 1px, transparent 1.3px);
  background-size:38px 38px, 23px 23px;
  background-position:0 0, 14px 11px;
  mask-image:linear-gradient(100deg, transparent 42%, #000 100%);
  -webkit-mask-image:linear-gradient(100deg, transparent 42%, #000 100%);
}
.banner-inner{max-width:1400px;margin:0 auto;display:flex;align-items:flex-start;gap:20px;position:relative;z-index:2}
.banner h1{
  font-family:var(--display); font-weight:800; font-size:clamp(21px,3.4vw,34px);
  line-height:1.08; letter-spacing:-.02em;
}
.banner .sub{font-size:13.5px;opacity:.78;margin-top:5px;font-weight:400;max-width:60ch}
.banner .eyebrow{
  font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase;
  opacity:.62; margin-bottom:8px; display:block;
}
.banner-side{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0}
.logo-box{
  width:62px;height:62px;border-radius:16px;
  display:grid;place-items:center;overflow:hidden;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.logo-box picture,.logo-box img{width:100%;height:100%;display:block;object-fit:contain}
.logo-box img{width:100%;height:100%;object-fit:contain}
.sync{
  display:flex;align-items:center;gap:7px;font-size:11.5px;font-family:var(--mono);
  background:rgba(255,255,255,.13);padding:5px 11px;border-radius:99px;white-space:nowrap;
}
.sync .dot{width:7px;height:7px;border-radius:99px;background:var(--verde);box-shadow:0 0 0 3px rgba(22,163,74,.28)}
.sync.off .dot{background:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.28)}
.sync.err .dot{background:#F87171;box-shadow:0 0 0 3px rgba(248,113,113,.28)}

/* ---------- TABS ---------- */
.tabs{
  background:var(--brand-deep); position:sticky; top:0; z-index:60;
  box-shadow:0 2px 12px rgba(27,16,53,.18);
}
.tabs-inner{max-width:1400px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 12px}
.tabs-inner::-webkit-scrollbar{display:none}
.tab{
  color:rgba(255,255,255,.62); padding:13px 17px; font-size:13.5px; font-weight:600;
  white-space:nowrap; border-bottom:3px solid transparent; display:flex; align-items:center; gap:7px;
  transition:color .15s, background .15s;
}
.tab:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab.on{color:#fff;border-bottom-color:var(--accent);background:rgba(255,255,255,.09)}
.tab .badge{
  background:var(--rojo);color:#fff;font-family:var(--mono);font-size:10px;font-weight:700;
  min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 5px;
}

/* ---------- LAYOUT ---------- */
main{max-width:1400px;margin:0 auto;padding:24px 20px 80px}
.view{display:none;animation:fade .28s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sec-head h2{font-family:var(--display);font-size:23px;font-weight:700;letter-spacing:-.015em}
.sec-head p{color:var(--ink-3);font-size:13px;margin-top:2px}
.sec-head .spacer{margin-left:auto}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- BOTONES ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;
  font-size:13.5px;font-weight:600;background:var(--card);border:1px solid var(--line);
  color:var(--ink-2);box-shadow:var(--sh-1);transition:.14s;
}
.btn:hover{border-color:var(--brand-soft);color:var(--brand);transform:translateY(-1px)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-deep);color:#fff}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.ghost:hover{background:var(--brand-wash)}
.btn.danger{color:var(--rojo);border-color:#F5C9C9}
.btn.danger:hover{background:#FEF2F2;border-color:var(--rojo);color:var(--rojo)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- CARDS / KPI ---------- */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.kpi{
  background:var(--card);border-radius:var(--r-m);padding:16px 17px;border:1px solid var(--line);
  box-shadow:var(--sh-1);position:relative;overflow:hidden;
}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand-soft)}
.kpi.v::before{background:var(--verde)} .kpi.a::before{background:var(--amarillo)}
.kpi.r::before{background:var(--rojo)}  .kpi.t::before{background:var(--accent)}
.kpi .lbl{font-size:11px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kpi .val{font-family:var(--display);font-size:31px;font-weight:800;line-height:1.05;margin-top:7px;letter-spacing:-.02em}
.kpi .sub{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh-1);overflow:hidden}
.panel-h{padding:14px 17px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.panel-h h3{font-family:var(--display);font-size:15.5px;font-weight:700}
.panel-h .spacer{margin-left:auto}
.panel-b{padding:16px 17px}

/* ---------- CEPARIO: años y meses ---------- */
.year-rule{display:flex;align-items:center;gap:16px;margin:34px 0 20px}
.year-rule:first-child{margin-top:6px}
.year-rule hr{flex:1;border:none;border-top:2px dashed #C9C2DC}
.year-rule .y{
  font-family:var(--mono);font-size:20px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;
}
.year-rule .n{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.months{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}
.mcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--sh-1);overflow:hidden;transition:.16s;cursor:pointer;position:relative;
  display:flex;flex-direction:column;
}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--brand-soft)}
.mcard .mtop{padding:13px 16px 11px;display:flex;align-items:center;gap:9px}
.mcard .mname{font-family:var(--display);font-size:16.5px;font-weight:700;text-transform:capitalize;letter-spacing:-.01em}
.mcard .mtag{
  margin-left:auto;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;padding:3px 8px;border-radius:99px;color:#fff;
}
.mcard .mbar{height:4px}
.mcard .mbody{display:grid;grid-template-columns:1fr 1px 1fr;flex:1}
.mcard .mcol{padding:12px 14px 14px;min-height:104px}
.mcard .mdiv{background:var(--line-2)}
.mcard .ctitle{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);display:flex;align-items:center;gap:5px;
}
.mcard .cnum{font-family:var(--display);font-size:26px;font-weight:800;line-height:1;margin:6px 0 8px;letter-spacing:-.02em}
.vials{display:flex;flex-wrap:wrap;gap:3.5px}
.vial{width:8px;height:8px;border-radius:2.5px;background:var(--gris);opacity:.9}
.vial.act{background:var(--brand-soft)}
.vial.atc{background:var(--accent)}
.vial.off{background:#D8D3E4}
.vials .more{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-left:2px}
.mcard .mfoot{
  padding:8px 14px;border-top:1px solid var(--line-2);font-size:11px;color:var(--ink-3);
  display:flex;align-items:center;gap:8px;font-family:var(--mono);
}
.mcard .mfoot .del{margin-left:auto;opacity:0;transition:.15s;color:var(--ink-3);padding:2px 6px;border-radius:6px}
.mcard:hover .mfoot .del{opacity:1}
.mcard .mfoot .del:hover{background:#FEF2F2;color:var(--rojo)}
.mcard.empty{border-style:dashed;box-shadow:none;background:transparent}

/* ---------- TABLA ---------- */
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
th{
  text-align:left;padding:10px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:1.5px solid var(--line);
  background:var(--brand-wash);position:sticky;top:0;white-space:nowrap;
}
td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--brand-wash)}
td .code{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--brand)}
td .org{font-style:italic;font-weight:500}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:11px;font-weight:600;background:var(--line-2);color:var(--ink-2);white-space:nowrap;
}
.pill.v{background:#DCFCE7;color:#15803D} .pill.a{background:#FEF3C7;color:#B45309}
.pill.r{background:#FEE2E2;color:#B91C1C} .pill.g{background:#F1F5F9;color:#64748B}
.pill.b{background:#E9E3F8;color:#5B2E9D} .pill.t{background:#CCF5F1;color:#0F766E}
.pill.tiny{font-size:10px;padding:2px 7px}
.chips{display:flex;flex-wrap:wrap;gap:4px}

/* ---------- FILTROS ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:flex;background:var(--line-2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-3)}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--sh-1)}
.inp,select.inp{
  padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  font-size:13.5px;min-width:0;box-shadow:var(--sh-1);
}
.inp:focus{border-color:var(--brand-soft);outline:none;box-shadow:0 0 0 3px rgba(123,79,196,.14)}
.search{flex:1;min-width:180px;max-width:340px}

/* ---------- FORMULARIO / MODAL ---------- */
.ovl{
  position:fixed;inset:0;background:rgba(27,16,53,.55);backdrop-filter:blur(4px);z-index:200;
  display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;
  animation:fade .18s ease;
}
.modal{
  background:var(--bg);border-radius:20px;box-shadow:var(--sh-3);width:100%;max-width:860px;
  overflow:hidden;margin:auto 0;animation:pop .22s cubic-bezier(.2,.9,.3,1.1);
}
.modal.wide{max-width:1120px}
.modal.narrow{max-width:460px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.mhead{
  background:linear-gradient(115deg,var(--brand-deep),#5B2E9D);color:#fff;padding:17px 22px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:3;
}
.mhead h3{font-family:var(--display);font-size:17px;font-weight:700}
.mhead .msub{font-size:12px;opacity:.72;margin-top:2px}
.mhead .x{margin-left:auto;color:#fff;font-size:24px;line-height:1;padding:0 6px;opacity:.8}
.mhead .x:hover{opacity:1}
.mbody{padding:20px 22px;max-height:calc(100vh - 210px);overflow-y:auto}
.mfoot2{
  padding:14px 22px;background:var(--card);border-top:1px solid var(--line);
  display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;
}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.fgrid.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f label{font-size:11.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.f label .req{color:var(--rojo)}
.f input,.f select,.f textarea{
  padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px;
}
.f input:focus,.f select:focus,.f textarea:focus{
  border-color:var(--brand-soft);outline:none;box-shadow:0 0 0 3px rgba(123,79,196,.14)
}
.f textarea{resize:vertical;min-height:66px;font-family:inherit}
.f .hint{font-size:11px;color:var(--ink-3)}
.fset{
  border:1px solid var(--line);border-radius:var(--r-m);padding:16px;background:var(--card);margin-bottom:14px;
}
.fset > legend{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--brand);padding:0 8px;font-weight:700;
}
.multi{display:flex;flex-wrap:wrap;gap:6px}
.multi label{
  display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);
  border-radius:99px;font-size:12.5px;cursor:pointer;background:var(--card);transition:.12s;user-select:none;
}
.multi label:hover{border-color:var(--brand-soft)}
.multi input{display:none}
.multi input:checked + span{color:var(--brand);font-weight:600}
.multi label:has(input:checked){background:var(--brand-wash);border-color:var(--brand-soft)}
.sw{display:flex;align-items:center;gap:10px;padding:9px 0}
.sw input{width:0;height:0;opacity:0;position:absolute}
.sw .track{
  width:42px;height:24px;border-radius:99px;background:#D8D3E4;position:relative;transition:.18s;flex-shrink:0;cursor:pointer;
}
.sw .track::after{
  content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:99px;
  background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.sw input:checked + .track{background:var(--brand)}
.sw input:checked + .track::after{transform:translateX(18px)}
.sw .txt{font-size:13.5px}

/* antibiograma */
.abg{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:7px}
.ab{display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.ab .n{font-family:var(--mono);font-size:11px;flex:1;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis}
.ab .opts{display:flex;gap:2px}
.ab .opts button{
  width:24px;height:24px;border-radius:6px;font-family:var(--mono);font-size:11px;font-weight:700;
  color:var(--ink-3);background:var(--line-2);
}
.ab .opts button.on[data-v="S"]{background:var(--verde);color:#fff}
.ab .opts button.on[data-v="I"]{background:var(--amarillo);color:#fff}
.ab .opts button.on[data-v="R"]{background:var(--rojo);color:#fff}

/* ---------- ALERTAS / LISTAS ---------- */
.alist{display:flex;flex-direction:column}
.al{display:flex;align-items:center;gap:12px;padding:11px 17px;border-bottom:1px solid var(--line-2);font-size:13px}
.al:last-child{border-bottom:none}
.al .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-size:15px}
.al .ico.r{background:#FEE2E2} .al .ico.a{background:#FEF3C7} .al .ico.b{background:var(--brand-wash)}
.al .tx{flex:1;min-width:0}
.al .tx b{font-weight:600}
.al .tx .m{color:var(--ink-3);font-size:11.5px;margin-top:1px}
.empty-st{padding:40px 20px;text-align:center;color:var(--ink-3)}
.empty-st .big{font-size:34px;margin-bottom:10px;opacity:.5}
.empty-st p{font-size:13.5px;margin-bottom:14px}

/* ---------- CHARTS ---------- */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(90px,168px) 1fr auto;gap:11px;align-items:center;font-size:12.5px}
.bar-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:italic}
.bar-row .track{height:19px;background:var(--line-2);border-radius:5px;overflow:hidden}
.bar-row .fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--brand),var(--brand-soft));transition:width .5s ease}
.bar-row .vl{font-family:var(--mono);font-size:12px;font-weight:600;min-width:34px;text-align:right}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px;flex:1;min-width:150px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .sq{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.legend .v{margin-left:auto;font-family:var(--mono);font-weight:600}
.spark{display:flex;align-items:flex-end;gap:5px;height:112px}
.spark .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.spark .b{width:100%;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--brand-soft),var(--brand));min-height:3px;transition:height .5s}
.spark .lb{font-family:var(--mono);font-size:9px;color:var(--ink-3);white-space:nowrap}

/* ---------- TOAST / PIN ---------- */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--ink);color:#fff;padding:11px 19px;border-radius:12px;font-size:13.5px;
  box-shadow:var(--sh-3);animation:up .25s ease;max-width:88vw;
}
.toast.ok{background:#14532D} .toast.err{background:#7F1D1D} .toast.warn{background:#78350F}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#pinGate{
  position:fixed;inset:0;z-index:500;display:none;place-items:center;
  background:linear-gradient(140deg,var(--brand-deep),#5B2E9D);
}
#pinGate.on{display:grid}
.pinbox{background:var(--card);padding:32px 30px;border-radius:20px;text-align:center;box-shadow:var(--sh-3);width:min(330px,90vw)}
.pinbox h2{font-family:var(--display);font-size:19px;margin-bottom:6px}
.pinbox p{font-size:13px;color:var(--ink-3);margin-bottom:18px}
.pinbox input{
  width:100%;padding:13px;text-align:center;font-family:var(--mono);font-size:24px;letter-spacing:.5em;
  border:1.5px solid var(--line);border-radius:12px;margin-bottom:14px;text-indent:.5em;
}
.loading{display:grid;place-items:center;padding:60px 20px;color:var(--ink-3);font-size:13.5px;gap:14px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:99px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- DETALLE ---------- */
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}
.dl .it{padding:10px 12px;background:var(--card);border:1px solid var(--line-2);border-radius:10px}
.dl .it .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.dl .it .v{font-size:13.5px;margin-top:3px;font-weight:500;word-break:break-word}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px;display:flex;flex-direction:column;gap:14px}
.tl .ev{position:relative;font-size:12.5px}
.tl .ev::before{content:'';position:absolute;left:-22px;top:5px;width:9px;height:9px;border-radius:99px;background:var(--brand-soft);border:2px solid var(--bg)}
.tl .ev .d{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}

/* ---------- RESPONSIVE ---------- */
@media (max-width:640px){
  main{padding:18px 13px 70px}
  .banner{padding:20px 15px 18px;padding-top:calc(20px + env(safe-area-inset-top))}
  .banner-inner{gap:12px}
  .logo-box{width:46px;height:46px;border-radius:13px;font-size:9px}
  .months{grid-template-columns:1fr}
  .sec-head h2{font-size:20px}
  .modal{border-radius:16px}
  .mbody{padding:16px 15px}
  .mhead{padding:14px 16px}
  .mfoot2{padding:12px 15px}
  .mfoot2 .btn{flex:1;justify-content:center}
  .kpi .val{font-size:26px}
  .bar-row{grid-template-columns:minmax(74px,110px) 1fr auto}
  .mcard .mfoot .del{opacity:1}
}


/* ---------- INSTALAR APP (PWA) ---------- */
.install-bar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));
  z-index:350;width:min(440px,calc(100vw - 24px));
  background:rgba(255,255,255,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid rgba(255,255,255,.55);border-radius:20px;
  box-shadow:0 18px 50px rgba(27,16,53,.28), inset 0 1px 0 rgba(255,255,255,.6);
  padding:14px 15px;display:flex;align-items:center;gap:13px;
  animation:slideUp .35s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes slideUp{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.install-bar .ic{
  width:48px;height:48px;border-radius:13px;flex-shrink:0;overflow:hidden;
  box-shadow:var(--sh-1);background:#fff;display:grid;place-items:center;
}
.install-bar .ic img{width:100%;height:100%;object-fit:contain}
.install-bar .tx{flex:1;min-width:0}
.install-bar .tx b{font-family:var(--display);font-size:14.5px;font-weight:700;display:block}
.install-bar .tx span{font-size:12px;color:var(--ink-2);display:block;margin-top:1px;line-height:1.35}
.install-bar .acts{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.install-bar .acts .btn{padding:8px 14px;font-size:13px}
.install-bar .cerrar{
  position:absolute;top:8px;right:10px;font-size:18px;color:var(--ink-3);line-height:1;padding:2px 5px;border-radius:6px;
}
.install-bar .cerrar:hover{background:rgba(0,0,0,.06)}
/* el atributo hidden debe ganarle a display:flex */
.install-bar[hidden]{display:none!important}
/* dentro de la app ya instalada, jamás mostrar el aviso de instalar */
@media (display-mode: standalone){ .install-bar{display:none!important} }
@media (display-mode: minimal-ui){ .install-bar{display:none!important} }
@media (prefers-color-scheme:dark){
  .install-bar{background:rgba(20,16,32,.72);border-color:rgba(255,255,255,.14);
    box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12)}
  .install-bar .tx b{color:#fff}
  .install-bar .tx span{color:#C9C2DC}
  .install-bar .ic{background:#0C0C10}
  .install-bar .cerrar{color:#9A93AE}
}
/* Hoja de instrucciones iOS */
.ios-steps{display:flex;flex-direction:column;gap:14px;padding:4px 2px}
.ios-steps .step{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.ios-steps .num{
  width:26px;height:26px;border-radius:99px;background:var(--brand);color:#fff;flex-shrink:0;
  display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12.5px;
}
.ios-steps .shareico{
  display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border:1.5px solid var(--brand);border-radius:6px;color:var(--brand);vertical-align:-5px;margin:0 2px;
}


/* ---------- SESIÓN / LOGIN / BLOQUEO ---------- */
#authGate{
  position:fixed;inset:0;z-index:500;display:none;place-items:center;padding:20px;
  background:
    radial-gradient(circle at 20% 120%, rgba(0,184,169,.25), transparent 50%),
    linear-gradient(140deg,var(--brand-deep),#5B2E9D);
}
#authGate.on{display:grid}
.authbox{
  background:rgba(255,255,255,.9);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid rgba(255,255,255,.6);border-radius:24px;box-shadow:var(--sh-3);
  width:min(380px,92vw);padding:30px 26px;text-align:center;
}
.authlogo{width:66px;height:66px;margin:0 auto 14px;border-radius:18px;background:#fff;box-shadow:var(--sh-1);overflow:hidden;display:grid;place-items:center}
.authlogo img{width:100%;height:100%;object-fit:contain}
.authbox h2{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.01em}
.authbox > p{font-size:13px;color:var(--ink-2);margin:6px 0 18px}
.authlbl{display:block;text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-2);margin:10px 2px 5px}
.authinp{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px}
.authinp:focus{border-color:var(--brand-soft);outline:none;box-shadow:0 0 0 3px rgba(123,79,196,.16)}
.authbtn{width:100%;justify-content:center;margin-top:18px;padding:12px}
.authlink{display:block;width:100%;margin-top:10px;color:var(--brand);font-size:13px;font-weight:600;background:none}
.autherr{color:var(--rojo);font-size:12.5px;margin-top:10px;min-height:16px;font-weight:600}
@media (prefers-color-scheme:dark){
  .authbox{background:rgba(22,17,34,.9);border-color:rgba(255,255,255,.14)}
  .authbox h2{color:#fff}.authbox>p{color:#C9C2DC}.authlbl{color:#C9C2DC}
  .authinp{background:#0C0C10;color:#fff;border-color:rgba(255,255,255,.16)}
}
/* chip de usuario en el banner */
.user-chip{
  display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.24);border-radius:99px;padding:4px 11px 4px 4px;cursor:pointer;
  color:#fff;font-size:12.5px;font-weight:600;
}
.user-chip:hover{background:rgba(255,255,255,.26)}
.user-chip .uav{width:24px;height:24px;border-radius:99px;background:var(--accent);color:#08312d;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px}

/* fila de permiso con interruptor */
.multi-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.multi-row:last-child{border-bottom:none}

/* ---------- GRADILLAS ---------- */
.grad-wrap{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,300px));justify-content:start}
.grad{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh-1);padding:14px}
.grad-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.grad-h b{font-family:var(--display);font-size:14px;font-weight:700}
.grad-h .gcount{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.grid-cells{display:grid;gap:4px}
.gcell{
  aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:var(--line-2);
  display:grid;place-items:center;font-family:var(--mono);font-size:7px;color:var(--ink-3);
  padding:0;min-width:0;max-width:26px;justify-self:center;width:100%;position:relative;transition:transform .1s;
}
.gcell span{opacity:.45;pointer-events:none}
.gcell.fill{background:var(--col);border-color:var(--col);cursor:pointer;box-shadow:inset 0 -2px 4px rgba(0,0,0,.12)}
.gcell.fill span{color:#fff;opacity:.9;font-weight:700}
.gcell.fill:hover{transform:scale(1.18);z-index:2;box-shadow:0 3px 10px rgba(0,0,0,.25)}
@media (max-width:640px){
  .grad-wrap{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .gcell{max-width:24px} .gcell span{font-size:7px}
}

/* ---------- IMPRESIÓN ---------- */
@media print{
  .tabs,.banner-side,.rowbtns,.filters,.btn,.mfoot,#toasts,.install-bar{display:none!important}
  body{background:#fff;font-size:11px}
  .banner{background:#fff!important;color:#000;padding:0 0 12px;border-bottom:2px solid #000}
  .banner::after{display:none}
  .view{display:none!important}
  .view.on{display:block!important}
  .panel,.mcard,.kpi{box-shadow:none;border:1px solid #999;break-inside:avoid}
  table{min-width:0;font-size:9.5px}
  th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .months{grid-template-columns:repeat(3,1fr)}
  @page{margin:12mm;size:landscape}
}
</style>

    }));

}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const hoy = () => fmtISO(new Date());
const mesActual = () => hoy().slice(0, 7);

function mesLabel(id) {
  if (!id) return "—";
  const [a, m] = id.split("-");
  return `${MESES[+m - 1]} ${a}`;
}
function mesNombre(id) { return MESES[+id.split("-")[1] - 1] || ""; }

function edadMeses(mesId) {
  if (!mesId) return 0;
  const [a, m] = mesId.split("-").map(Number);
  const [ha, hm] = mesActual().split("-").map(Number);
  return (ha - a) * 12 + (hm - m);
}
function diasEntre(d1, d2) {
  if (!d1 || !d2) return null;
  return Math.round((new Date(d2 + "T00:00") - new Date(d1 + "T00:00")) / 86400000);
}
function sumarMeses(fecha, n) {
  const d = new Date(fecha + "T00:00");
  d.setMonth(d.getMonth() + n);
  return fmtISO(d);
}
function sumarDias(fecha, n) {
  const d = new Date(fecha + "T00:00");
  d.setDate(d.getDate() + n);
  return fmtISO(d);
}
function fFecha(f) {
  if (!f) return "—";
  const [a, m, d] = f.split("-");
  return `${d}/${m}/${a}`;
}
function cat(k) {
  const c = state.cfg.catalogos || {};
  return (c[k] && c[k].length) ? c[k] : CAT[k];
}

/* ---- Semáforo ---- */
function semaforoNativa(cepa) {
  if (["Descartada", "No viable", "Contaminada", "Agotada"].includes(cepa.estado)) return "gris";
  const e = edadMeses(cepa.mesId);
  const c = state.cfg;
  if (e <= c.natVerde) return "verde";
  if (e <= c.natAmarillo) return "amarillo";
  return "rojo";
}
function semaforoATCC(cepa) {
  if (["Descartada", "No viable", "Contaminada", "Agotada"].includes(cepa.estado)) return "gris";
  const c = state.cfg;
  const p = Number(cepa.pase || 0);
  let s = p <= c.atccVerde ? "verde" : (p <= c.atccAmarillo ? "amarillo" : "rojo");
  // el vencimiento del cultivo de trabajo también puede degradar el color
  if (cepa.fechaVence) {
    const d = diasEntre(hoy(), cepa.fechaVence);
    if (d !== null) {
      if (d < 0) s = "rojo";
      else if (d <= c.diasAviso && s === "verde") s = "amarillo";
    }
  }
  return s;
}
function semaforo(cepa) { return cepa.tipo === "atcc" ? semaforoATCC(cepa) : semaforoNativa(cepa); }
function semaforoMes(mesId) {
  const c = state.cfg;
  if (c.criterioMes === "peor") {
    const cs = cepasDeMes(mesId).filter(x => semaforo(x) !== "gris");
    if (!cs.length) return "gris";
    const ss = cs.map(semaforo);
    if (ss.includes("rojo")) return "rojo";
    if (ss.includes("amarillo")) return "amarillo";
    return "verde";
  }
  const e = edadMeses(mesId);
  if (e <= c.natVerde) return "verde";
  if (e <= c.natAmarillo) return "amarillo";
  return "rojo";
}
function colorSem(s) {
  const c = state.cfg;
  return { verde: c.cVerde, amarillo: c.cAmarillo, rojo: c.cRojo, gris: "#94A3B8" }[s] || "#94A3B8";
}
function claseSem(s) { return { verde: "v", amarillo: "a", rojo: "r", gris: "g" }[s] || "g"; }
function textoSem(s, tipo) {
  if (s === "gris") return "inactiva";
  if (tipo === "atcc") return { verde: "pase ok", amarillo: "revisar", rojo: "pase límite" }[s];
  return { verde: "vigente", amarillo: "por vencer", rojo: "vencida" }[s];
}

function cepasDeMes(mesId) { return state.cepas.filter(c => c.mesId === mesId); }

function vencimientoNativa(cepa) {
  if (!cepa.fechaIngreso) return null;
  return sumarMeses(cepa.fechaIngreso, state.cfg.natRetencion);
}

function escuchar() {
  if (!db) { setSync("err", "Solo local"); return; }
  setSync("off", "Conectando…");
  const cols = ["cepas", "meses", "qc", "usuarios", "papelera"];
  let errores = 0;
  cols.forEach(c => {
    onSnapshot(collection(db, c), snap => {
      state[c] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.ready[c] = true;
      cloudOK = true; setSync("", "En vivo");
      saveLocal(); asegurarMesActual(); render();
    }, err => {
      console.error(c, err); errores++;
      ultimoError = err;
      setSync("err", "Sin conexión");
      if (errores === 1) toast("Toca «Sin conexión» arriba para ver el diagnóstico", "err");
    });
  });
  onSnapshot(doc(db, "config", "general"), d => {
    if (d.exists()) state.cfg = { ...DEFAULT_CFG, ...d.data() };
    state.ready.cfg = true;
    aplicarMarca(); saveLocal(); render();
  }, err => { ultimoError = err; });
}

async function asegurarMesActual() {

  if (!state.meses.some(x => x.id === m)) {
    const nuevo = { id: m, anio: +m.split("-")[0], mes: +m.split("-")[1], auto: true, creado: new Date().toISOString() };
    state.meses.push(nuevo); saveLocal();
    if (db) { try { await setDoc(doc(db, "meses", m), nuevo); } catch (e) {} }
  }
}

/* ══════════════════════════════════════════════════════════════
   7. ALERTAS
   ══════════════════════════════════════════════════════════════ */
function alertas() {
  const out = [];
  const c = state.cfg;
  const activas = state.cepas.filter(x => !["Descartada", "No viable", "Agotada"].includes(x.estado));

  activas.filter(x => x.tipo === "nativa").forEach(x => {
    const v = vencimientoNativa(x);
    const d = diasEntre(hoy(), v);
    if (d === null) return;
    if (d < 0) out.push({ n: "r", t: `${x.codigo} — ${x.microorganismo}`, m: `Superó los ${c.natRetencion} meses de conservación (venció el ${fFecha(v)}). Evaluar descarte.`, id: x.id });
    else if (d <= c.diasAviso) out.push({ n: "a", t: `${x.codigo} — ${x.microorganismo}`, m: `Vence en ${d} día${d === 1 ? "" : "s"} (${fFecha(v)}).`, id: x.id });
  });

  activas.filter(x => x.tipo === "atcc").forEach(x => {
    if (Number(x.pase) >= c.atccPaseMax)
      out.push({ n: "r", t: `${x.codigo} — ${x.microorganismo}`, m: `Alcanzó el pase ${x.pase} de ${c.atccPaseMax}. Reconstituir un vial madre nuevo.`, id: x.id });
    else if (Number(x.pase) === c.atccPaseMax - 1)
      out.push({ n: "a", t: `${x.codigo} — ${x.microorganismo}`, m: `Va en el pase ${x.pase}. Queda 1 pase disponible.`, id: x.id });
    if (x.fechaVence) {
      const d = diasEntre(hoy(), x.fechaVence);
      if (d !== null && d < 0) out.push({ n: "r", t: `${x.codigo} — cultivo de trabajo`, m: `El cultivo de trabajo venció el ${fFecha(x.fechaVence)}.`, id: x.id });
    }
  });

  activas.forEach(x => {
    const ult = state.qc.filter(q => q.cepaId === x.id).sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""))[0];
    if (!ult) out.push({ n: "b", t: `${x.codigo} — ${x.microorganismo}`, m: "Sin registro de control de calidad (pureza / viabilidad).", id: x.id });
    else if (ult.resultado === "No conforme") out.push({ n: "r", t: `${x.codigo} — ${x.microorganismo}`, m: `Último control de calidad no conforme (${fFecha(ult.fecha)}).`, id: x.id });
  });

  return out.sort((a, b) => ({ r: 0, a: 1, b: 2 }[a.n] - { r: 0, a: 1, b: 2 }[b.n]));
}

        </div>` : `<div class="empty-st"><div class="big">✓</div><p>Todo al día. Ninguna cepa vencida ni pase en el límite.</p></div>`}
      </div>

      <div class="panel">
        <div class="panel-h"><h3>Ingresos por mes</h3></div>
        <div class="panel-b">
          <div class="spark">
            ${serie.map(s => `<div class="col">
              <div class="b" style="height:${Math.max(3, (s.n / maxS) * 88)}px" title="${s.n} cepas"></div>
              <div class="lb">${mesNombre(s.id).slice(0, 3)}</div>
              <div class="lb" style="color:var(--ink-2);font-weight:600">${s.n}</div>
            </div>`).join("")}
          </div>
        </div>
        <div class="panel-h" style="border-top:1px solid var(--line-2);border-bottom:none"><h3>Últimos registros</h3></div>
        <div class="alist">
          ${ultimos.length ? ultimos.map(c => `
            <div class="al" onclick="app.detalle('${c.id}')" style="cursor:pointer">
              <div class="ico b" style="background:${colorSem(semaforo(c))}22;color:${colorSem(semaforo(c))}">${c.tipo === "atcc" ? "R" : "N"}</div>
              <div class="tx"><b class="org" style="font-style:italic">${esc(c.microorganismo)}</b>
                <div class="m">${esc(c.codigo)} · ${mesLabel(c.mesId)}</div></div>
              <span class="pill ${claseSem(semaforo(c))} tiny">${textoSem(semaforo(c), c.tipo)}</span>
            </div>`).join("")
          : `<div class="empty-st"><p>Aún no hay cepas registradas.</p><button class="btn primary" onclick="app.formCepa('nativa')">Registrar la primera</button></div>`}
        </div>
      </div>
    </div>`;
}

/* ══════════════════════════════════════════════════════════════
   9. VISTA: CEPARIO (tarjetas por mes)
   ══════════════════════════════════════════════════════════════ */
function vCepario() {
  const ids = [...new Set([...state.meses.map(m => m.id), ...state.cepas.map(c => c.mesId).filter(Boolean)])]
    .sort().reverse();
  const anios = [...new Set(ids.map(i => i.split("-")[0]))].sort().reverse();

  let html = `
    <div class="sec-head">
      <div>
        <h2>Cepario por mes</h2>
        <p>Lo más reciente arriba. Cada tarjeta separa cepas nativas de cepas de referencia ATCC.</p>
      </div>
      <div class="spacer"></div>
      <div class="rowbtns">
        <span class="pill v tiny">0–${state.cfg.natVerde} meses</span>
        <span class="pill a tiny">${state.cfg.natVerde + 1}–${state.cfg.natAmarillo} meses</span>
        <span class="pill r tiny">${state.cfg.natAmarillo + 1}+ meses</span>
        ${can("crear") ? `<button class="btn" onclick="app.formMes()">+ Agregar mes</button>` : ""}
        ${btnAgregar(true)}
      </div>
    </div>`;

  if (!ids.length) {
    html += `<div class="panel"><div class="empty-st"><div class="big">▦</div>
      <p>El cepario está vacío. El mes actual se crea solo al registrar la primera cepa.</p>
      ${btnAgregar(true)}</div></div>`;
    $("#v-cepario").innerHTML = html; return;
  }

  anios.forEach(a => {
    const delAnio = ids.filter(i => i.startsWith(a));
    const total = delAnio.reduce((s, i) => s + cepasDeMes(i).length, 0);
    html += `<div class="year-rule"><hr><span class="y">${a}</span><span class="n">${total} cepas</span><hr></div>
      <div class="months">${delAnio.map(tarjetaMes).join("")}</div>`;
  });

  $("#v-cepario").innerHTML = html;
}

function tarjetaMes(id) {
  const todas = cepasDeMes(id);
  const nat = todas.filter(c => c.tipo === "nativa");
  const atc = todas.filter(c => c.tipo === "atcc");
  const s = semaforoMes(id);
  const col = colorSem(s);
  const e = edadMeses(id);
  const esActual = id === mesActual();

  const vials = arr => {
    const max = 28;
    const v = arr.slice(0, max).map(c => {
      const sm = semaforo(c);
      return `<span class="vial" style="background:${colorSem(sm)}" title="${esc(c.codigo)} · ${esc(c.microorganismo)}"></span>`;
    }).join("");
    return v + (arr.length > max ? `<span class="more">+${arr.length - max}</span>` : "") ||
      `<span style="font-size:11px;color:var(--ink-3)">—</span>`;
  };

  return `<article class="mcard" onclick="app.verMes('${id}')">
    <div class="mbar" style="background:${col}"></div>
    <div class="mtop">
      <span class="mname">${mesNombre(id)}</span>
      ${esActual ? `<span class="pill b tiny">actual</span>` : ""}
      <span class="mtag" style="background:${col}">${textoSem(s, "nativa")}</span>
    </div>
    <div class="mbody">
      <div class="mcol">
        <div class="ctitle">Nativas · paciente</div>
        <div class="cnum">${nat.length}</div>
        <div class="vials">${vials(nat)}</div>
      </div>
      <div class="mdiv"></div>
      <div class="mcol">
        <div class="ctitle">ATCC · referencia</div>
        <div class="cnum">${atc.length}</div>
        <div class="vials">${vials(atc)}</div>
      </div>
    </div>
    <div class="mfoot">
      <span>${e === 0 ? "mes en curso" : `hace ${e} ${e === 1 ? "mes" : "meses"}`}</span>
      ${can("eliminarMes") ? `<button class="del" title="Eliminar mes" onclick="event.stopPropagation();app.borrarMes('${id}')">✕</button>` : ""}
    </div>
  </article>`;
}

/* ══════════════════════════════════════════════════════════════
   10. VISTA: CEPAS (tabla)
   ══════════════════════════════════════════════════════════════ */
function cepasFiltradas() {
  const f = state.filtro;
  const q = f.q.toLowerCase().trim();
  return state.cepas.filter(c => {
    if (f.tipo !== "todas" && c.tipo !== f.tipo) return false;
    if (f.estado && c.estado !== f.estado) return false;
    if (f.mes && c.mesId !== f.mes) return false;
    if (f.org && c.microorganismo !== f.org) return false;
    if (f.semaforo && semaforo(c) !== f.semaforo) return false;
    if (q) {
      const t = [c.codigo, c.microorganismo, c.codigoRef, c.numMuestra, c.tipoMuestra,
        c.servicio, c.responsable, c.ubicCaja, c.lote, (c.perfiles || []).join(" ")]
        .join(" ").toLowerCase();
      if (!t.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => (b.fechaIngreso || "").localeCompare(a.fechaIngreso || "") || (b.codigo || "").localeCompare(a.codigo || ""));
}

}

function refrescarTabla() {
  const b = document.querySelector("#cepasBody");
  if (!b) return vCepas();
  const l = cepasFiltradas();
  b.innerHTML = filasCepas(l);
  const c = document.querySelector("#cepasCount");
  if (c) c.textContent = `${l.length} de ${state.cepas.length} registros`;
}

/* ══════════════════════════════════════════════════════════════
   12. VISTA: ESTADÍSTICAS
   ══════════════════════════════════════════════════════════════ */
function conteo(arr, key) {
  const m = {};
  arr.forEach(x => {
    const vals = Array.isArray(x[key]) ? x[key] : [x[key]];
    vals.filter(Boolean).forEach(v => m[v] = (m[v] || 0) + 1);
  });
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
}
function barras(datos, total, limite = 10) {
  if (!datos.length) return `<div class="empty-st"><p>Sin datos suficientes.</p></div>`;
  const max = datos[0][1];
  return `<div class="bars">${datos.slice(0, limite).map(([n, v]) => `
    <div class="bar-row">
      <span class="nm" title="${esc(n)}">${esc(n)}</span>
      <div class="track"><div class="fill" style="width:${(v / max) * 100}%"></div></div>
      <span class="vl">${v}${total ? ` <span style="color:var(--ink-3);font-weight:400">(${Math.round(v/total*100)}%)</span>` : ""}</span>
    </div>`).join("")}</div>`;
}
function donut(datos, colores) {
  const total = datos.reduce((s, d) => s + d[1], 0);
  if (!total) return `<div class="empty-st"><p>Sin datos.</p></div>`;
  const R = 54, C = 2 * Math.PI * R;
  let off = 0;
  const segs = datos.map(([n, v], i) => {
    const len = (v / total) * C;
    const s = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${colores[i % colores.length]}"
      stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}"
      transform="rotate(-90 70 70)"><title>${esc(n)}: ${v}</title></circle>`;
    off += len; return s;
  }).join("");
  return `<div class="donut-wrap">
    <svg width="140" height="140" viewBox="0 0 140 140" style="flex-shrink:0">
      ${segs}
      <text x="70" y="66" text-anchor="middle" font-family="'Bricolage Grotesque',sans-serif" font-size="25" font-weight="800" fill="#1B1035">${total}</text>
      <text x="70" y="83" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7C7492">TOTAL</text>
    </svg>
    <div class="legend">${datos.map(([n, v], i) => `
      <div><span class="sq" style="background:${colores[i % colores.length]}"></span>${esc(n)}<span class="v">${v}</span></div>`).join("")}</div>
  </div>`;
}

function vStats() {
  const cs = state.cepas;
  const act = cs.filter(x => !["Descartada","No viable","Agotada"].includes(x.estado));
  const nat = cs.filter(x => x.tipo === "nativa");

  // resistencia por antibiótico
  const abg = {};
  nat.forEach(c => (c.antibiograma || []).forEach(a => {
    if (!abg[a.atb]) abg[a.atb] = { S: 0, I: 0, R: 0 };
    if (a.v) abg[a.atb][a.v]++;
  }));
  const resist = Object.entries(abg)
    .map(([atb, o]) => { const t = o.S + o.I + o.R; return [atb, t ? Math.round(o.R / t * 100) : 0, t]; })
    .filter(x => x[2] > 0).sort((a, b) => b[1] - a[1]);

  const PAL = ["#4C2A85","#7B4FC4","#00B8A9","#F59E0B","#DC2626","#16A34A","#0EA5E9","#DB2777","#65A30D","#9333EA"];

  $("#v-stats").innerHTML = `
    <div class="sec-head">
      <div><h2>Estadísticas del cepario</h2><p>Sobre ${cs.length} registros históricos · ${act.length} en custodia</p></div>
    </div>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start">

      <div class="panel">
        <div class="panel-h"><h3>Microorganismos más conservados</h3></div>
        <div class="panel-b">${barras(conteo(cs, "microorganismo"), cs.length, 12)}</div>
      </div>

      <div class="panel">
        <div class="panel-h"><h3>Composición del cepario</h3></div>
        <div class="panel-b">${donut([
          ["Nativas (paciente)", cs.filter(c=>c.tipo==="nativa").length],
          ["Referencia ATCC", cs.filter(c=>c.tipo==="atcc").length]
        ], ["#4C2A85","#00B8A9"])}</div>
      </div>

      <div class="panel">
        <div class="panel-h"><h3>Mecanismos y fenotipos de resistencia</h3></div>
        <div class="panel-b">${barras(conteo(nat, "perfiles"), nat.length, 12)}</div>
      </div>

      <div class="panel">
        <div class="panel-h"><h3>Estado del semáforo</h3></div>
        <div class="panel-b">${donut([
          ["Vigentes", act.filter(c=>semaforo(c)==="verde").length],
          ["Por vencer", act.filter(c=>semaforo(c)==="amarillo").length],
          ["Vencidas / límite", act.filter(c=>semaforo(c)==="rojo").length]
        ], [state.cfg.cVerde, state.cfg.cAmarillo, state.cfg.cRojo])}</div>
      </div>

      <div class="panel">
        <div class="panel-h"><h3>Tipo de muestra</h3></div>
        <div class="panel-b">${barras(conteo(nat, "tipoMuestra"), nat.length, 10)}</div>
      </div>

      <div class="panel">
        <div class="panel-h"><h3>Servicio de procedencia</h3></div>
        <div class="panel-b">${barras(conteo(nat, "servicio"), nat.length, 10)}</div>
      </div>

      <div class="panel">
        <div class="panel-h"><h3>Resistencia por antibiótico</h3><div class="spacer"></div><span class="pill g tiny">% resistentes</span></div>
        <div class="panel-b">${resist.length ? `<div class="bars">${resist.slice(0,14).map(([a,p,t]) => `
          <div class="bar-row">

function abrirModal(html, ancho = "") {
  const d = document.createElement("div");
  d.className = "ovl";
  d.innerHTML = `<div class="modal ${ancho}">${html}</div>`;
  d.addEventListener("click", e => { if (e.target === d) cerrarModal(); });
  $("#modals").appendChild(d);
  document.body.style.overflow = "hidden";
  return d;
}
function cerrarModal() {
  const m = $("#modals").lastElementChild;
  if (m) m.remove();
  if (!$("#modals").children.length) document.body.style.overflow = "";
}
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarModal(); });

function opts(lista, sel) {
  return `<option value=""></option>` + lista.map(o => `<option value="${esc(o)}" ${o === sel ? "selected" : ""}>${esc(o)}</option>`).join("");
}

function nuevoCodigo(tipo, mesId) {
  const [y, m] = (mesId || mesActual()).split("-");
  const pre = tipo === "atcc" ? (state.cfg.prefijoAtcc || "REF") : (state.cfg.prefijoNat || "NAT");
  const n = state.cepas.filter(c => c.tipo === tipo && c.mesId === `${y}-${m}`).length + 1;
  return `${pre}-${y}-${m}-${String(n).padStart(3, "0")}`;
}

function setAB(btn) {
  const box = btn.closest(".opts");
  const yaEstaba = btn.classList.contains("on");
  box.querySelectorAll("button").forEach(b => b.classList.remove("on"));
  if (!yaEstaba) btn.classList.add("on");
}
function recalcPase() {
  const fp = $("#fc_fpase");
  const fv = $("#fc_fvence");
  if (fp && fv && fp.value) fv.value = sumarDias(fp.value, state.cfg.atccVigenciaDias);
}

function val(id) { const e = $("#" + id); return e ? e.value.trim() : ""; }

async function saveCepa() {
  if (!can("crear")) return toast("No tienes permiso para modificar cepas.", "err");
  const id = val("fc_id");
  const tipo = val("fc_tipo");
  const prev = id ? state.cepas.find(c => c.id === id) : null;

  const org = val("fc_org"), codigo = val("fc_codigo"), fing = val("fc_fing");
  if (!codigo) return toast("Falta el código interno de la cepa.", "err");
  if (!org) return toast("Falta el microorganismo.", "err");
  if (!fing) return toast("Falta la fecha de ingreso al cepario.", "err");

  const c = {
    id: id || uid(), tipo, codigo, microorganismo: org,
    bsl: val("fc_bsl"), identificacion: val("fc_ident"),
    fechaIngreso: fing, mesId: fing.slice(0, 7),
    medio: val("fc_medio"), ubicEquipo: val("fc_equipo"), ubicCaja: val("fc_caja"),
    ubicPos: val("fc_pos"), viales: +val("fc_viales") || 0, motivo: val("fc_motivo"),
    responsable: val("fc_resp"), estado: val("fc_estado") || "Activa",
    fechaDescarte: val("fc_fdesc"), metodoDescarte: val("fc_mdesc"), responsableDescarte: val("fc_rdesc"),
    observaciones: val("fc_obs"),
    creado: prev?.creado || new Date().toISOString(),
    historial: prev?.historial || []
  };

  if (tipo === "atcc") {
    Object.assign(c, {
      codigoRef: val("fc_ref"), proveedor: val("fc_prov"), lote: val("fc_lote"),
      fechaRecepcion: val("fc_recep"), clase: val("fc_clase"), certificado: val("fc_cert"),
      pase: +val("fc_pase") || 0, fechaPase: val("fc_fpase"), fechaVence: val("fc_fvence"),
      cepaMadre: val("fc_madre"), proposito: val("fc_proposito")
    });
    if (prev && +prev.pase !== c.pase)
      c.historial.push({ f: new Date().toISOString(), t: `Pase actualizado: ${prev.pase} → ${c.pase} (${fFecha(c.fechaPase)})` });
  } else {
    Object.assign(c, {
      numMuestra: val("fc_nmuestra"), tipoMuestra: val("fc_tmuestra"), servicio: val("fc_serv"),
      paciente: val("fc_pac"), fechaAislamiento: val("fc_faisl"), iaas: val("fc_iaas"),
      envioINS: val("fc_ins"), fechaINS: val("fc_finsdate"), resultadoINS: val("fc_insres"),
      perfiles: [...document.querySelectorAll(".fc_perfil:checked")].map(i => i.value),
      antibiograma: [...document.querySelectorAll("#abgBox .ab")].map(el => {
        const on = el.querySelector(".opts button.on");
        return on ? { atb: el.dataset.atb, v: on.dataset.v } : null;
      }).filter(Boolean)
    });
  }

  if (prev && prev.estado !== c.estado)
    c.historial.push({ f: new Date().toISOString(), t: `Estado: ${prev.estado} → ${c.estado}` });
  if (!prev) c.historial.push({ f: new Date().toISOString(), t: "Cepa registrada en el cepario" });

  // asegurar que exista el mes
  if (!state.meses.some(m => m.id === c.mesId)) {
    const nm = { id: c.mesId, anio: +c.mesId.split("-")[0], mes: +c.mesId.split("-")[1], auto: true, creado: new Date().toISOString() };
    state.meses.push(nm);
    if (db) { try { await setDoc(doc(db, "meses", nm.id), nm); } catch (e) {} }
  }

  await guardar("cepas", c);
  cerrarModal();
  toast(id ? "Cambios guardados" : `Cepa ${c.codigo} registrada`, "ok");
}

async function borrarCepa(id) {

async function subirPase(id) {
  const c = state.cepas.find(x => x.id === id);
  if (!c) return;
  const nuevo = Number(c.pase || 0) + 1;
  if (nuevo > state.cfg.atccPaseMax) {
    if (!confirm(`El pase ${nuevo} supera el máximo permitido (${state.cfg.atccPaseMax}).\n\nSegún ISO 11133 deberías reconstituir un vial madre nuevo en lugar de seguir subcultivando. ¿Registrar el pase de todas formas?`)) return;
  }
  c.pase = nuevo;
  c.fechaPase = hoy();
  c.fechaVence = sumarDias(hoy(), state.cfg.atccVigenciaDias);
  c.historial = c.historial || [];
  c.historial.push({ f: new Date().toISOString(), t: `Nuevo pase registrado: ${nuevo} (vence ${fFecha(c.fechaVence)})` });
  await guardar("cepas", c);
  cerrarModal(); detalle(id);
  toast(`Pase ${nuevo} registrado · vence el ${fFecha(c.fechaVence)}`, "ok");
}

async function saveMes() {
  const m = String($("#fm_mes").value).padStart(2, "0");
  const a = $("#fm_anio").value;
  const id = `${a}-${m}`;
  if (state.meses.some(x => x.id === id)) { cerrarModal(); return toast("Ese mes ya existe en el cepario", "warn"); }
  await guardar("meses", { id, anio: +a, mes: +m, auto: false, creado: new Date().toISOString() });
  cerrarModal(); toast(`${mesLabel(id)} agregado`, "ok");
}

async function borrarMes(id) {
  if (!can("eliminarMes")) return toast("Sólo un administrador puede eliminar meses completos.", "err");
  if (id === mesActual()) return toast("El mes en curso no se puede eliminar; se vuelve a crear solo.", "warn");
  const cs = cepasDeMes(id);
  const mes = state.meses.find(m => m.id === id) || { id, anio: +id.split("-")[0], mes: +id.split("-")[1] };
  if (!confirm(`¿Eliminar ${mesLabel(id)}?\n\nSe moverán ${cs.length} cepa${cs.length === 1 ? "" : "s"} a la papelera y podrás restaurar el mes completo.`)) return;
  await enviarPapelera("mes", { mes, cepas: cs });
  for (const cc of cs) await borrar("cepas", cc.id);
  await borrar("meses", id);
  cerrarModal(); toast("Mes enviado a la papelera", "ok");
}

   15. CONFIGURACIÓN / EXPORTAR

function saveCfg() {
  // el interruptor de sesión (cf_authon) lo puede tocar quien administra usuarios
  const authEl = $("#cf_authon");
  if (authEl) state.cfg.authActivo = authEl.checked;
  if (!can("config")) { guardarCfg(); return; }
  const n = (id, def) => { const v = +val(id); return isNaN(v) ? def : v; };
  const c = state.cfg;
  Object.assign(c, {
    titulo: val("cf_titulo") || DEFAULT_CFG.titulo,
    subtitulo: val("cf_sub"), eyebrow: val("cf_eye"), logoUrl: val("cf_logo"),
    cMarca: val("cf_marca"), cVerde: val("cf_cv"), cAmarillo: val("cf_ca"), cRojo: val("cf_cr"),
    natVerde: n("cf_nv", 3), natAmarillo: n("cf_na", 5), natRetencion: n("cf_nr", 6),
    diasAviso: n("cf_av", 15), criterioMes: val("cf_crit"),
    atccPaseMax: n("cf_pm", 5), atccVerde: n("cf_pv", 3), atccAmarillo: n("cf_pa", 4),
    atccVigenciaDias: n("cf_vd", 30), atccVigenciaMeses: n("cf_vm", 24),
    bloqueoMin: n("cf_bloqueo", 60),
    prefijoNat: (val("cf_pnat") || "NAT").toUpperCase(), prefijoAtcc: (val("cf_patcc") || "REF").toUpperCase(),
    gradillaNatCap: n("cf_gncap", 100), gradillaNatCols: n("cf_gncols", 10),
    gradillaAtccCap: n("cf_gacap", 50), gradillaAtccCols: n("cf_gacols", 10)
  });
  if (c.natAmarillo < c.natVerde) c.natAmarillo = c.natVerde;
  c.catalogos = c.catalogos || {};
  ["microorganismos","tiposMuestra","servicios","perfiles","medios","equipos","motivos","antibioticos",
   "estados","bsl","identificacion","proveedores","conservacion"].forEach(k => {
    const t = $("#cf_cat_" + k);
    if (!t) return;
    const arr = t.value.split("\n").map(s => s.trim()).filter(Boolean);
    if (arr.length) c.catalogos[k] = arr; else delete c.catalogos[k];
  });
  guardarCfg(); toast("Configuración guardada", "ok");
}
function resetCfg() {
  if (!confirm("¿Restablecer toda la configuración a los valores iniciales?")) return;
  state.cfg = { ...DEFAULT_CFG }; guardarCfg(); toast("Configuración restablecida", "ok");
}

function descargar(nombre, contenido, tipo) {
  const b = new Blob([contenido], { type: tipo });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = nombre; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

  ];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [cols.map(c => c[1]).concat(["Semáforo","Vence (calc.)","Perfiles","Antibiograma"]).map(q).join(";")];
  cepasFiltradas().forEach(c => {
    const base = cols.map(k => q(c[k[0]]));
    base.push(q(semaforo(c)));
    base.push(q(c.tipo === "nativa" ? vencimientoNativa(c) : c.fechaVence));
    base.push(q((c.perfiles || []).join(" | ")));
    base.push(q((c.antibiograma || []).map(a => `${a.atb}:${a.v}`).join(" | ")));
    rows.push(base.join(";"));
  });
  descargar(`cepario_${hoy()}.csv`, "\uFEFF" + rows.join("\n"), "text/csv;charset=utf-8");
  toast("CSV descargado", "ok");
}
function exportJSON() {
  descargar(`respaldo_cepario_${hoy()}.json`,
    JSON.stringify({ cepas: state.cepas, meses: state.meses, qc: state.qc, cfg: state.cfg }, null, 2),
    "application/json");

}

/* ══════════════════════════════════════════════════════════════
   v2 — USUARIOS · PERMISOS · SESIÓN · BLOQUEO · GRADILLAS · PAPELERA
   ══════════════════════════════════════════════════════════════ */

const PERMISOS = [
  ["crear", "Crear y editar cepas y controles de calidad"],
  ["eliminar", "Enviar cepas a la papelera"],
  ["eliminarMes", "Eliminar meses completos"],
  ["papelera", "Restaurar o vaciar la papelera"],
  ["config", "Cambiar la configuración y las listas"],
  ["usuarios", "Administrar usuarios"],
  ["exportar", "Exportar e imprimir"]
];
const ROLES = {
  admin:  { nom: "Administrador", perms: PERMISOS.map(p => p[0]) },
  editor: { nom: "Editor",        perms: ["crear", "eliminar", "exportar"] },
  lector: { nom: "Solo lectura",  perms: ["exportar"] }
};

function usuarioActual() { return state.usuario || null; }

function can(perm) {
  if (!state.cfg.authActivo) return true;         // sin sesión activada, todos pueden
  const u = state.usuario;
  if (!u) return false;
  if (u.rol === "admin") return true;
  const extra = u.permisos || {};
  if (Object.prototype.hasOwnProperty.call(extra, perm)) return !!extra[perm];
  return (ROLES[u.rol]?.perms || []).includes(perm);
}

function usuariosActivos() { return state.usuarios.filter(u => u.activo !== false); }
function necesitaLogin() { return state.cfg.authActivo && usuariosActivos().length > 0 && !state.usuario; }

/* ---------- Botones de agregar (dos: nativa y ATCC) ---------- */
function btnAgregar(primario) {
  if (!can("crear")) return "";
  return `<button class="btn ${primario ? "primary" : ""}" onclick="app.formCepa('nativa')">+ Cepa nativa</button>
          <button class="btn" onclick="app.formCepa('atcc')">+ Cepa ATCC</button>`;
}

/* ══════════════════════════════════════════════════════════════
   SESIÓN: login inicial y pantalla de bloqueo
   ══════════════════════════════════════════════════════════════ */
let lockTimer = null, bloqueado = false;

function reiniciarInactividad() {
  clearTimeout(lockTimer);
  if (state.cfg.authActivo && state.usuario && !bloqueado) {
    const min = state.cfg.bloqueoMin || 60;
    lockTimer = setTimeout(bloquearSesion, min * 60000);
  }
}
["click", "keydown", "input", "touchstart", "mousemove"].forEach(ev =>
  document.addEventListener(ev, () => reiniciarInactividad(), { passive: true }));

function pantallaSesion(modo) {
  // modo: "login" (entrada) | "lock" (bloqueo por inactividad)
  const users = usuariosActivos();
  const actual = modo === "lock" ? state.usuario : null;
  const g = document.getElementById("authGate");
  g.innerHTML = `
    <div class="authbox">
      <div class="authlogo"><img src="${(document.querySelector('#bLogo img')||{}).src||''}" alt=""></div>
      <h2>${modo === "lock" ? "Sesión bloqueada" : "Cepario de Microbiología"}</h2>
      <p>${modo === "lock"
          ? "Se bloqueó por inactividad. Ingresa tu contraseña para continuar donde ibas."
          : "Selecciona tu usuario e ingresa la contraseña."}</p>
      <label class="authlbl">Usuario</label>
      <select id="authUser" class="authinp">
        ${users.map(u => `<option value="${u.id}" ${actual && actual.id === u.id ? "selected" : ""}>${esc(u.nombre)}${u.rol === "admin" ? " · admin" : ""}</option>`).join("")}
      </select>
      <label class="authlbl">Contraseña</label>
      <input type="password" id="authPass" class="authinp" inputmode="text" autocomplete="off" placeholder="••••••••">
      <button class="btn primary authbtn" onclick="app.entrar('${modo}')">${modo === "lock" ? "Desbloquear" : "Entrar"}</button>
      ${modo === "lock" ? `<button class="authlink" onclick="app.entrarOtro()">Entrar con otro usuario</button>` : ""}
      <p class="autherr" id="authErr"></p>
    </div>`;
  g.classList.add("on");
  bloqueado = (modo === "lock");
  setTimeout(() => { const p = document.getElementById("authPass"); if (p) p.focus(); }, 60);
}

function entrar(modo) {
  const uid_ = document.getElementById("authUser")?.value;
  const pass = document.getElementById("authPass")?.value || "";
  const u = state.usuarios.find(x => x.id === uid_);
  const err = document.getElementById("authErr");
  if (!u) { if (err) err.textContent = "Selecciona un usuario."; return; }
  if (String(u.password || "") !== pass) { if (err) err.textContent = "Contraseña incorrecta."; return; }

  const cambioUsuario = !state.usuario || state.usuario.id !== u.id;
  state.usuario = u;
  try { sessionStorage.setItem("cepario_uid", u.id); } catch (e) {}
  document.getElementById("authGate").classList.remove("on");
  bloqueado = false;
  reiniciarInactividad();

  if (modo === "lock" && !cambioUsuario) {
    // desbloqueo del mismo usuario → seguir donde estaba (no se toca nada)
    aplicarUsuarioUI();
    toast(`Bienvenido de nuevo, ${u.nombre.split(" ")[0]}`, "ok");
  } else {
    // login nuevo o cambio de usuario → cerrar modales y volver al inicio
    document.getElementById("modals").innerHTML = "";
    document.body.style.overflow = "";
    ir("inicio");
    toast(`Sesión iniciada: ${u.nombre}`, "ok");
  }
}
function entrarOtro() { pantallaSesion("login"); }

function bloquearSesion() {
  if (!state.cfg.authActivo || !state.usuario || bloqueado) return;
  pantallaSesion("lock");   // overlay encima; el estado y los modales quedan intactos
}
function cerrarSesion() {
  if (!confirm("¿Cerrar sesión?")) return;
  state.usuario = null;
  try { sessionStorage.removeItem("cepario_uid"); } catch (e) {}
  document.getElementById("modals").innerHTML = "";
  document.body.style.overflow = "";
  clearTimeout(lockTimer);
  ir("inicio");
  if (necesitaLogin()) pantallaSesion("login");
  aplicarUsuarioUI();
}

function aplicarUsuarioUI() {
  const chip = document.getElementById("userChip");
  if (!chip) return;
  if (state.cfg.authActivo && state.usuario) {
    chip.hidden = false;
    chip.innerHTML = `<span class="uav">${esc((state.usuario.nombre || "?").slice(0, 1).toUpperCase())}</span>
      <span class="uname">${esc(state.usuario.nombre.split(" ")[0])}</span>`;
  } else { chip.hidden = true; }
}

/* Se llama en cada render para mostrar/ocultar el login según el estado */
function controlarAcceso() {
  const gate = document.getElementById("authGate");
  if (!necesitaLogin() && !bloqueado && gate) gate.classList.remove("on");
  if (necesitaLogin() && !bloqueado) {
    // intentar restaurar sesión de esta pestaña
    let uid_ = null;
    try { uid_ = sessionStorage.getItem("cepario_uid"); } catch (e) {}
    const u = uid_ && state.usuarios.find(x => x.id === uid_ && x.activo !== false);
    if (u) { state.usuario = u; reiniciarInactividad(); aplicarUsuarioUI(); return; }
    pantallaSesion("login");
  }
  aplicarUsuarioUI();
}

async function enviarPapelera(tipo, payload) {
  await guardar("papelera", {
    id: uid(), tipo, payload,
    fecha: new Date().toISOString(),
    por: state.usuario?.nombre || "—"
  });
}
async function restaurarPapelera(id) {
  const r = state.papelera.find(x => x.id === id);
  if (!r) return;
  if (r.tipo === "cepa") {
    await guardar("cepas", r.payload.cepa);
    if (!state.meses.some(m => m.id === r.payload.cepa.mesId)) {
      const mi = r.payload.cepa.mesId;
      await guardar("meses", { id: mi, anio: +mi.split("-")[0], mes: +mi.split("-")[1], auto: true, creado: new Date().toISOString() });
    }
  } else if (r.tipo === "mes") {
    await guardar("meses", r.payload.mes);
    for (const c of (r.payload.cepas || [])) await guardar("cepas", c);
  }
  await borrar("papelera", id);
  toast("Restaurado correctamente", "ok");
}
async function purgarPapelera(id) {
  if (!confirm("¿Eliminar esto de forma DEFINITIVA? No se podrá recuperar.")) return;
  await borrar("papelera", id);
  toast("Eliminado definitivamente", "warn");
}
async function vaciarPapelera() {
  if (!state.papelera.length) return;
  if (!confirm(`¿Vaciar la papelera por completo? Se eliminarán ${state.papelera.length} elemento(s) sin posibilidad de recuperación.`)) return;
  for (const r of [...state.papelera]) await borrar("papelera", r.id);
  toast("Papelera vaciada", "warn");
}

/* ══════════════════════════════════════════════════════════════
   VISTA: GRADILLAS
   ══════════════════════════════════════════════════════════════ */
function vGradillas() {
  const cfg = state.cfg;
  const meses = [...new Set(state.cepas.map(c => c.mesId).filter(Boolean))].sort().reverse();
  const activa = c => !["Descartada", "No viable", "Agotada"].includes(c.estado);

  let html = `
    <div class="sec-head">
      <div><h2>Gradillas del cepario</h2>
        <p>Vista física de la nevera. Cada círculo es un espacio; se llena a medida que registras cepas. Pasa el cursor para ver la cepa, o tócala para abrirla.</p></div>
      <div class="spacer"></div>
      <div class="rowbtns">
        <span class="pill v tiny">vigente</span><span class="pill a tiny">por vencer</span>
        <span class="pill r tiny">vencida</span>
        ${can("config") ? `<button class="btn sm" onclick="app.ir('config')">Ajustar tamaño</button>` : ""}
      </div>
    </div>`;

  const tipos = [
    { t: "nativa", nom: "Nativas · paciente", cap: cfg.gradillaNatCap || 100, cols: cfg.gradillaNatCols || 10 },
    { t: "atcc", nom: "Referencia ATCC", cap: cfg.gradillaAtccCap || 50, cols: cfg.gradillaAtccCols || 10 }
  ];

  let algo = false;
  meses.forEach(mid => {
    const bloquesMes = tipos.map(info => {
      const cs = cepasDeMes(mid).filter(c => c.tipo === info.t && activa(c))
        .sort((a, b) => (a.fechaIngreso || "").localeCompare(b.fechaIngreso || "") || (a.codigo || "").localeCompare(b.codigo || ""));
      if (!cs.length) return "";
      const nRacks = Math.ceil(cs.length / info.cap);
      let out = "";
      for (let r = 0; r < nRacks; r++) {
        const chunk = cs.slice(r * info.cap, (r + 1) * info.cap);
        out += gradilla(mid, info, r + 1, nRacks, chunk);
      }
      return out;
    }).join("");
    if (bloquesMes) {
      algo = true;
      html += `<div class="year-rule"><hr><span class="y" style="font-size:16px;text-transform:capitalize">${mesLabel(mid)}</span><hr></div>
        <div class="grad-wrap">${bloquesMes}</div>`;
    }
  });

  if (!algo) html += `<div class="panel"><div class="empty-st"><div class="big">▦</div><p>Aún no hay cepas activas para mostrar en las gradillas.</p>${can("crear") ? `<button class="btn primary" onclick="app.formCepa('nativa')">Registrar una cepa</button>` : ""}</div></div>`;

  $("#v-gradillas").innerHTML = html;
}

function gradilla(mid, info, num, total, chunk) {
  const cap = info.cap, cols = Math.max(1, Math.min(info.cap, info.cols));
  let celdas = "";
  for (let i = 0; i < cap; i++) {
    const c = chunk[i];
    if (c) {
      const s = semaforo(c);
      celdas += `<button class="gcell fill" style="--col:${colorSem(s)}"
        title="${esc(c.codigo)} · ${esc(c.microorganismo)}"
        onclick="app.detalle('${c.id}')"><span>${i + 1}</span></button>`;
    } else {
      celdas += `<span class="gcell"><span>${i + 1}</span></span>`;
    }
  }
  return `<div class="grad">
    <div class="grad-h">
      <b>${info.nom}</b>
      <span class="pill b tiny">Gradilla ${num}${total > 1 ? " / " + total : ""}</span>
      <span class="gcount">${chunk.length}/${cap}</span>
    </div>
    <div class="grid-cells" style="grid-template-columns:repeat(${cols},1fr)">${celdas}</div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════
   IMPRESIÓN RÁPIDA (iframe dedicado, no imprime toda la app)
   ══════════════════════════════════════════════════════════════ */
function imprimir(tipo) {
  if (!can("exportar")) return toast("No tienes permiso para imprimir", "err");
  const cont = construirImpresion(tipo);
  let f = document.getElementById("printFrame");
  if (!f) {
    f = document.createElement("iframe");
    f.id = "printFrame";
    f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
    document.body.appendChild(f);
  }
  const d = f.contentWindow.document;
  d.open(); d.write(cont); d.close();
  const go = () => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { window.print(); } };
  if (f.contentWindow.document.readyState === "complete") setTimeout(go, 150);
  else f.onload = () => setTimeout(go, 150);
}

function construirImpresion(tipo) {
  const c = state.cfg;

    <td>${fFecha(x.fechaIngreso)}</td>
    <td>${fFecha(x.tipo === "atcc" ? x.fechaVence : vencimientoNativa(x))}</td>
    <td>${esc(x.estado || "")}</td>
    <td>${esc(x.responsable || "")}</td>
  </tr>`;
  return `<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>${esc(c.titulo)}</title>
  <style>
    *{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;box-sizing:border-box}
    body{margin:14mm;color:#111}
    h1{font-size:17px;margin:0 0 2px} .sub{color:#555;font-size:11px;margin-bottom:12px}
    table{width:100%;border-collapse:collapse;font-size:9.5px}
    th{background:#eee;text-align:left;padding:5px 6px;border:1px solid #bbb;font-size:8.5px;text-transform:uppercase;letter-spacing:.03em}
    td{padding:4px 6px;border:1px solid #ccc;vertical-align:top}
    tr:nth-child(even) td{background:#f7f7f9}
    .foot{margin-top:10px;font-size:9px;color:#666;display:flex;justify-content:space-between}
    @page{size:landscape;margin:10mm}
  </style></head><body>
    <h1>${esc(c.titulo)}</h1>
    <div class="sub">${esc(c.subtitulo)} — Listado impreso el ${fFecha(hoy())} · ${lista.length} cepas${state.usuario ? " · " + esc(state.usuario.nombre) : ""}</div>
    <table><thead><tr>
      <th>Código</th><th>Microorganismo</th><th>Tipo</th><th>Origen / ref.</th><th>Pase</th>
      <th>Ubicación</th><th>Ingreso</th><th>Vence</th><th>Estado</th><th>Responsable</th>
    </tr></thead><tbody>${lista.map(fila).join("")}</tbody></table>
    <div class="foot"><span>${esc(c.eyebrow)}</span><span>Cepario HDSR</span></div>
